services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: knowledge
      POSTGRES_USER: knowledge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U knowledge -d knowledge"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 10

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir=/etcd
    volumes: [etcd_data:/etcd]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    command: minio server /data --console-address :9001
    volumes: [minio_data:/data]

  milvus:
    image: milvusdb/milvus:v2.5.10
    command: [milvus, run, standalone]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes: [milvus_data:/var/lib/milvus]
    depends_on: [etcd, minio]
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9091/healthz]
      interval: 15s
      timeout: 5s
      retries: 20

  migrate:
    build: ./backend
    env_file: ${ENV_FILE:-.env}
    command: [alembic, upgrade, head]
    depends_on:
      postgres: {condition: service_healthy}

  api:
    build: ./backend
    env_file: ${ENV_FILE:-.env}
    volumes: [object_data:/app/storage/objects]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      milvus: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    build: ./backend
    env_file: ${ENV_FILE:-.env}
    command: [celery, -A, knowledge_worker.celery_app:celery_app, worker, --beat, --loglevel=INFO]
    volumes: [object_data:/app/storage/objects]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      milvus: {condition: service_healthy}

  web:
    build: ./frontend
    ports: ["${WEB_PORT:-80}:80"]
    depends_on:
      api: {condition: service_healthy}

volumes:
  postgres_data:
  redis_data:
  etcd_data:
  minio_data:
  milvus_data:
  object_data:
