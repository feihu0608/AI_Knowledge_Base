[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-knowledge-base-backend"
version = "0.1.0"
description = "Multi-tenant AI knowledge base with LangGraph, Milvus and governed agents"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic==1.16.5",
  "celery==5.5.3",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "langgraph>=0.6,<1.0",
  "langgraph-checkpoint-postgres>=2.0,<3.0",
  "psycopg[binary]==3.2.10",
  "pydantic-settings>=2.10,<3.0",
  "pymilvus>=2.5,<3.0",
  "pyjwt==2.10.1",
  "python-multipart==0.0.20",
  "redis==6.4.0",
  "sqlalchemy==2.0.43",
  "uvicorn[standard]==0.35.0",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.uv]
package = false

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  "apps/api",
  "packages/domain",
  "packages/application",
  "packages/agent_harness",
  "packages/graphs",
  "packages/providers",
  "packages/retrieval",
  "packages/vector_store",
  "packages/persistence",
  "packages/mcp_gateway",
  "packages/observability",
  "packages/evaluation",
]

[tool.ruff]
line-length = 110
target-version = "py312"
